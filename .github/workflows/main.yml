name: Sync with upstream
on:
  schedule:
    - cron: '0 */1 * * *'  # Every 1 hour
  workflow_dispatch:  # Manual trigger button
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure Git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
      - name: Sync upstream
        run: |
          git remote add upstream https://github.com/jinming99/learn-ml-by-building
          git fetch upstream
          git checkout main
          git merge upstream/main -X theirs || {
            echo "Merge conflicts detected, resolving automatically"
            git status --porcelain | grep "^UU" | awk '{print $2}' | xargs git add
            git commit -m "Auto-resolve merge conflicts with upstream changes"
          }
          git push origin main
